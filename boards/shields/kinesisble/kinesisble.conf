# The MCP23S17 column expander sits on SPI. Its driver is enabled
# automatically from the devicetree node.
CONFIG_SPI=y

# Deep sleep after 15 minutes idle (in ms). Waking from deep sleep restarts
# the board, so the battery level is shown on wake.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Report the battery level to connected hosts every 60 seconds.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Five Bluetooth profiles, with a low-latency connection interval (7.5-15 ms).
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Link the app after the SoftDevice at the bootloader's code partition, and
# store settings (BT pairings, etc.) in flash. Without these the firmware
# links at 0x0 and nothing persists across resets. Do not remove.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Bring USB up earlier than ZMK's default (96), as in the original build.
CONFIG_ZMK_USB_INIT_PRIORITY=50

# &bootloader support for the Adafruit nRF52 bootloader (Zephyr 4.1 boot retention).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_ZMK_BOOTMODE_MAGIC_VALUE_BOOTLOADER_TYPE_ADAFRUIT_NRF52=y

# No USB serial console by default, to save power. For debug logs over USB,
# build with `-S zmk-usb-logging`, which turns these back on.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
